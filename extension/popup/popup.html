<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Zapfire</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg-elevated: #141414;
      --border: #262626;
      --text: #f5f5f5;
      --text-dim: #a3a3a3;
      --accent: #ff3b30;
      --accent-glow: rgba(255, 59, 48, 0.15);
      --success: #10b981;
      --warning: #ff6b00;
      --danger:  #dc2626;
    }

    body {
      width: 360px;
      min-height: 400px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 900;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
    .tagline { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .content { padding: 20px; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ---------- Login ---------- */
    .label {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: block;
    }

    .input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 13px;
      outline: none;
    }
    .input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .error {
      background: rgba(255, 59, 48, 0.1);
      border: 1px solid rgba(255, 59, 48, 0.3);
      color: var(--accent);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
    }

    /* ---------- Authenticated ---------- */
    .status-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .status-row + .status-row {
      border-top: 1px solid var(--border);
    }

    .status-key { color: var(--text-dim); font-size: 12px; }
    .status-value { font-weight: 500; }
    .status-value.mono { font-family: 'SF Mono', monospace; font-size: 11px; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .badge.warning {
      background: rgba(255, 107, 0, 0.15);
      color: var(--warning);
    }
    .badge.danger {
      background: rgba(220, 38, 38, 0.15);
      color: var(--danger);
    }

    .help-link {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .help-link a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Z</div>
    <div>
      <div class="brand">Zapfire</div>
      <div class="tagline">Superpoderes no WhatsApp Web</div>
    </div>
  </div>

  <div class="content">
    <!-- ======================= LOGIN ======================= -->
    <div class="screen" id="screen-login">
      <label class="label" for="input-key">Chave de acesso</label>
      <input
        type="text"
        class="input"
        id="input-key"
        placeholder="Cole sua chave de 32 caracteres"
        maxlength="32"
        autocomplete="off"
      />
      <button class="btn" id="btn-login">Ativar</button>
      <div id="login-error" class="error" style="display:none"></div>

      <div class="help-link">
        Ainda não tem chave?
        <a href="https://zapfire-five.vercel.app" target="_blank">Assine aqui</a>
      </div>
    </div>

    <!-- =================== AUTHENTICATED =================== -->
    <div class="screen" id="screen-auth">
      <!-- Sprint 4 — banner de grace/blocked, aparece quando license state requer -->
      <div id="license-banner" hidden></div>

      <div class="status-card">
        <div class="status-row">
          <span class="status-key">Status</span>
          <span class="badge success" id="auth-status-badge">Ativa</span>
        </div>
        <div class="status-row">
          <span class="status-key">Conta</span>
          <span class="status-value" id="auth-label"></span>
        </div>
        <div class="status-row">
          <span class="status-key">Número</span>
          <span class="status-value mono" id="auth-phone"></span>
        </div>
        <div class="status-row">
          <span class="status-key">Plano</span>
          <span class="status-value" id="auth-plan"></span>
        </div>
        <div class="status-row">
          <span class="status-key">Vence em</span>
          <span class="status-value" id="auth-expires"></span>
        </div>
      </div>

      <button class="btn" id="btn-open-manager">Abrir gerenciador</button>
      <button class="btn btn-ghost" id="btn-logout">Desconectar</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
